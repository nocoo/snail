name: Release
run-name: Deploy CI ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source-run-id }}

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source-run-id:
        description: "Successful CI run ID to deploy"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.repository == 'nocoo/snail')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency:
      group: snail-production
      cancel-in-progress: false
    steps:
      - name: Prove the successful CI source
        id: source
        uses: nocoo/base-ci/.github/actions/release-source@8cbdb970c3a38240289c1e152c40dd550ac62dba
        with:
          github-token: ${{ github.token }}
          expected-workflow-path: ".github/workflows/verify.yml"
          expected-workflow-name: "CI"
          expected-branch: main
          source-run-id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || inputs.source-run-id }}
          allowed-source-events: "push,workflow_dispatch"
          require-fresh-main: true
      - name: Checkout the proven source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.source.outputs.target-sha }}
          persist-credentials: false
      - name: Install pinned tools and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@081cdf665b9c67f233abfcc9242ce0be76ce2bb4
        with:
          package-manager: bun
          runtime-version: "1.4.0"
          node-version: "26.8.1"
          install-policy: "project"
      - name: Build and verify the deployment package
        run: |
          bun -e 'if (require("./node_modules/wrangler/package.json").version !== "4.131.0") throw new Error("Wrangler version mismatch")'
          bun run brand:check
          bun run build
          bun run worker:check
      - name: Require the current main immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.source.outputs.target-sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_SHA"
      - name: Apply migrations and deploy Snail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          bun run deploy
      - name: Verify HTTPS, public health and authentication boundaries
        run: |
          for attempt in 1 2 3 4 5 6; do
            if bun run production:check; then exit 0; fi
            sleep 5
          done
          exit 1
