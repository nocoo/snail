[extend]
useDefault = true

[[allowlists]]
description = "Ignored local-only test artifacts never enter Git or CI"
paths = ['''^\.artifacts/''', '''^node_modules/''', '''^\.wrangler/''']

[[allowlists]]
description = "Snail's public Access JWT audience; not a secret or another application's audience"
condition = "AND"
paths = ['''^wrangler\.jsonc$''', '''^worker/worker-configuration\.d\.ts$''']
regexTarget = "line"
regexes = ['''^\s*"?ACCESS_AUD"?\s*:\s*"ea6297edaa67c77e284b40930d448a529452c0dc97eee1394f4082d2968a26a7"[,;]?\s*$''']

[[allowlists]]
description = "Frozen research table: key is a literal R2 object path, not a credential"
condition = "AND"
paths = ['''^docs/02-X示例实测与最小Spike\.md$''']
regexTarget = "line"
regexes = ['''^\| `/read\?key=thumbnail/fixed` \| 200 \| 本地 R2 返回封面 \| 169456 字节；完整哈希相同 \|$''']
